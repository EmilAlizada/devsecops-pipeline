name: CI / Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-placeholder-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: pytest -q
      - run: bandit -q -r config health -x health/tests.py
      - run: pip-audit -r requirements.txt
      - run: docker build --tag devsecops-pipeline:ci .
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: devsecops-pipeline:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
